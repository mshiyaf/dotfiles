git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --line-numbers --paging=never
  branchLogCmd: "git log --graph --name-status --pretty=format:\"%C(red)%h %C(reset)(%cd) %C(green)%an %Creset%s %C(yellow)%d%Creset\" --date=relative"
gui:
  theme:
    activeBorderColor:
      - "#e6b450"
      - bold
    inactiveBorderColor:
      - "#aad94c"
    searchingActiveBorderColor:
      - "#39bae6"
      - bold
    optionsTextColor:
      - "#8e959e"
    selectedLineBgColor:
      - "#272c36"
    inactiveViewSelectedLineBgColor:
      - bold
    cherryPickedCommitFgColor:
      - "#8e959e"
    cherryPickedCommitBgColor:
      - "#39bae6"
    markedBaseCommitFgColor:
      - "#39bae6"
    markedBaseCommitBgColor:
      - "#d95757"
    unstagedChangesColor:
      - "#d95757"
    defaultFgColor:
      - "#d1d1c7"
refresher:
  refreshInterval: 3
os:
  edit: "vim"
customCommands:
  - key: <c-a>
    context: files
    description: AI commit staged changes (opencode)
    command: opencode run "/commit" --auto
    output: terminal
    loadingText: Generating AI commit...
  - key: <c-g>
    context: global
    description: Show GitHub Actions runs
    command: "gh run list --limit 10"
    output: popup
    loadingText: Fetching GitHub Actions runs...
  - key: <c-w>
    context: global
    description: Watch latest GitHub Actions run
    command: "gh run watch $(gh run list --limit 1 --json databaseId --jq '.[0].databaseId')"
    output: popup
