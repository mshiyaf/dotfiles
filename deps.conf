# Runtime dependencies of each stow package, read by ./bootstrap.sh.
#
# Columns (whitespace separated; everything after `need` is a free-text note):
#   package  the stow package directory, or `core` for what bootstrap itself needs
#   source   pacman - official Arch repos
#            aur    - AUR on plain Arch (installed from a configured repo such as
#                     CachyOS's when one ships it, otherwise only via an AUR helper
#                     after a separate confirmation)
#            manual - vendor installer; bootstrap prints the note and never runs it
#   name     the pacman/AUR package name (`-` for manual)
#   check    a command on PATH, an absolute path that must exist, or `-` to ask
#            pacman whether `name` (or a package providing it) is installed
#   need     req - the package's config breaks without it
#            opt - one feature degrades without it
#
# package     source  name                          check                                             need  note
core          pacman  git                           git                                               req
core          pacman  stow                          stow                                              req
core          pacman  make                          make                                              req

agents        pacman  bun                           bun                                               opt   runs scripts/.local/bin/agents-sync after editing agent sources
agents        manual  -                             claude                                            opt   curl -fsSL https://claude.ai/install.sh | bash
agents        manual  -                             codex                                             opt   npm i -g @openai/codex
