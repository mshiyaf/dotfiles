# Elsewhen: a world clock, ported from Omarchy's Elsewhen bar panel.
#
# The headless service probes every zone's UTC offset with `date` (Luau has no
# time zone database) and owns the city list; the bar widget and the panel tick
# the clocks locally against those offsets.

id = "mshiyaf/elsewhen"
name = "Elsewhen"
version = "0.1.0"
# require() of relative modules (22) and runAsync argv tables (24).
plugin_api = 24
author = "mshiyaf"
license = "MIT"
icon = "world"
description = "A world clock: the time in several cities at once, with each city's day and daylight."
tags = ["time", "clock", "bar", "panel", "service"]
dependencies = ["bash", "date", "timedatectl"]

[[setting]]
key = "hour24"
type = "bool"
label_key = "settings.hour24.label"
description_key = "settings.hour24.description"
default = false

[[setting]]
key = "offset_mode"
type = "select"
label_key = "settings.offset_mode.label"
description_key = "settings.offset_mode.description"
default = "home"
options = [
  { value = "home", label_key = "settings.offset_mode.options.home" },
  { value = "utc", label_key = "settings.offset_mode.options.utc" },
]

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "clock"
entry = "widget.luau"

  [widget.actions]
  left = "panel-toggle mshiyaf/elsewhen:panel"

  [[widget.setting]]
  key = "show_city"
  type = "bool"
  label_key = "settings.show_city.label"
  description_key = "settings.show_city.description"
  default = false

[[panel]]
id = "panel"
entry = "panel.luau"
width = 400
height = 740
placement = "floating"
position = "auto"
open_near_click = true
dismiss_on_outside_click = true
