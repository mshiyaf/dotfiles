[shell]
font_family = "Noto Sans"
polkit_agent = true

[shell.panel]
control_center_placement = "floating"
open_near_click_control_center = true
polkit_placement = "attached"
transparency_mode = "soft"

# Hide the Caps/Num/Scroll Lock popups (Noctalia default: on).
# Voxtype types through wtype, whose virtual keyboard makes niri flip
# Num Lock off and on after every dictation. This laptop has no numpad,
# and keyd remaps Caps Lock, so these popups are only noise.
[osd.kinds]
lock_keys = false

[lockscreen]
allow_empty_password = true
transition_duration = 1000
