# TCP BBR congestion control, installed to /etc/sysctl.d/99-bbr.conf.
# BBR paces uploads by the link's measured bandwidth and delay instead of
# backing off on every lost packet, which helps on Wi-Fi.
# fq is the queueing discipline BBR is designed to pace with.
# Undo: delete the file and run `sudo sysctl --system`.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
